<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>키즈마켓 접수 관리</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin/panel.css"><script type="module" src="/admin/panel.js"></script></head>
<body><main class="admin-shell">
 <header><p class="section-tag">가곡동 상상창고</p><h1>키즈마켓 접수 관리</h1><p>신청 순서대로 접수 내역을 확인합니다.</p></header>
 <p id="message" role="status" aria-live="polite">관리자 접속 상태를 확인하고 있습니다.</p>
 <form id="login" class="registration" hidden>
 <label for="pin">관리자 비밀번호</label><input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" autocomplete="current-password" required maxlength="12">
 <button type="submit">로그인</button></form>
 <section id="panel" aria-label="신청 목록" hidden>
  <div class="admin-actions"><button id="refresh" type="button">새로고침</button><button id="download" type="button">엑셀 다운로드</button><button id="logout" type="button">로그아웃</button></div>
  <p id="range"></p>
  <div class="table-scroll" tabindex="0" aria-label="가로로 스크롤 가능한 접수 내역"><table>
   <thead><tr><th scope="col">순서</th><th scope="col">접수 시각</th><th scope="col">보호자</th><th scope="col">휴대전화</th><th scope="col">참여 인원</th><th scope="col">물품</th><th scope="col">상태</th></tr></thead>
   <tbody id="rows"></tbody>
  </table></div>
  <div class="admin-actions pages"><button id="previous" type="button">이전</button><button id="next" type="button">다음</button></div>
 </section>
</main></body></html>
